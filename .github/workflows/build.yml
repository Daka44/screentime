name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install pywin32 psutil requests pyinstaller

    - name: Windows용 .exe 빌드
      run: |
        pyinstaller --onefile --noconsole screentime.py

    - name: 완성된 exe 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: screentime-windows
        
        path: dist/screentime.exe
